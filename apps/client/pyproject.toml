[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dosr-client"
version = "0.1.0"
description = "DOSR client: CLI + local GUI for creating repos, building PRs, and requesting attested reviews"
requires-python = ">=3.10"
dependencies = [
    "dosr-protocol",
    "dosr-git-storage",
    "dosr-chain",
    "httpx>=0.27",
    "rich>=13.7",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
dosr = "dosr_client.cli:main"

[tool.setuptools.packages.find]
include = ["dosr_client*"]

[tool.setuptools.package-data]
dosr_client = ["gui/static/*"]
