[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dosr-chain"
version = "0.1.0"
description = "DOSR chain adapter (v0.1: file-backed mock of the repository contract)"
requires-python = ">=3.10"
dependencies = ["dosr-protocol"]

[tool.setuptools.packages.find]
include = ["dosr_chain*"]
