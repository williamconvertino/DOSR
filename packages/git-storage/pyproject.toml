[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dosr-git-storage"
version = "0.1.0"
description = "DOSR Git adapter: repository operations and git bundles (IPFS adapter to come)"
requires-python = ">=3.10"
dependencies = ["dosr-protocol"]

[tool.setuptools.packages.find]
include = ["dosr_git*"]
