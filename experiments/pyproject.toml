[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dosr-eval"
version = "0.1.0"
description = "DOSR review evaluation harness: runs labeled PR cases through the attestor's exact prompt path"
requires-python = ">=3.10"
dependencies = ["dosr-protocol", "dosr-git-storage", "httpx"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["dosr_eval*"]
